name = "mercado-frete-pagamentos"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Central: banco SQLite (Durable Object) com clientes, motoristas, corridas, chat e localização
[[durable_objects.bindings]]
name = "CENTRAL"
class_name = "Central"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Central"]

# Fotos e documentos (privado)
[[r2_buckets]]
binding = "DOCS"
bucket_name = "mercado-frete-docs"

[vars]
INFINITEPAY_HANDLE = "smayleiluiz"
APP_SCHEME = "mercadofrete"

# Segredos (nunca no arquivo):
#   npx wrangler secret put INFINITEPAY_API_KEY
#   npx wrangler secret put ADMIN_TOKEN
